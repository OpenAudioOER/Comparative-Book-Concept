<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Reading Progress Bar (Purely visual indicator with aria-hidden per accessibility best practices) -->
<div id="scroll-progress" aria-hidden="true"></div>

<style>
/* CSS Scroll Progress Bar per Modern Web Guidance */
#scroll-progress {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, #1e3a8a, #3b82f6, #06b6d4, #10b981);
  transform-origin: 0 50%;
  z-index: 99999;
  pointer-events: none;
  opacity: 0.95;
  box-shadow: 0 1px 4px rgba(37, 99, 235, 0.3);
}

@media (prefers-reduced-motion: no-preference) {
  @supports ((animation-timeline: scroll())) {
    @keyframes grow-scroll-progress {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    #scroll-progress {
      animation: grow-scroll-progress auto linear;
      animation-timeline: scroll(root block);
    }
  }
}
</style>
