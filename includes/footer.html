<script>
document.addEventListener('DOMContentLoaded', () => {
  // Calculate estimated reading time for content chapters
  const content = document.querySelector('main.content');
  if (content) {
    const text = content.innerText || '';
    const wordCount = text.trim().split(/\s+/).length;
    const readingTimeMin = Math.max(1, Math.ceil(wordCount / 225));
    
    // Inject reading time badge right below the chapter heading
    const chapterHeading = document.querySelector('main.content h1');
    if (chapterHeading && !document.querySelector('.reading-meta-badge')) {
      const badge = document.createElement('div');
      badge.className = 'reading-meta-badge';
      badge.innerHTML = `
        <span class="meta-item"><i class="bi bi-clock-history" aria-hidden="true"></i> ${readingTimeMin} min read</span>
        <span class="meta-item-separator" aria-hidden="true">•</span>
        <span class="meta-item"><i class="bi bi-file-text" aria-hidden="true"></i> ${wordCount.toLocaleString()} words</span>
        <span class="meta-item-separator" aria-hidden="true">•</span>
        <span class="meta-item badge-oer"><i class="bi bi-award" aria-hidden="true"></i> Open Access 2nd Ed.</span>
      `;
      chapterHeading.insertAdjacentElement('afterend', badge);
    }
  }

  // Interactive self-check question toggles
  document.querySelectorAll('.knowledge-check-card').forEach(card => {
    const btn = card.querySelector('.kc-toggle-btn');
    const answer = card.querySelector('.kc-answer');
    if (btn && answer) {
      btn.addEventListener('click', () => {
        const isHidden = answer.style.display === 'none' || !answer.style.display;
        answer.style.display = isHidden ? 'block' : 'none';
        btn.textContent = isHidden ? 'Hide Explanation & Answer' : 'Reveal Explanation & Answer';
        btn.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
      });
    }
  });
});
</script>
