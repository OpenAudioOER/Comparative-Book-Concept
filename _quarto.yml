project:
  type: book

book:
  title: "Introduction to Comparative Government and Politics (2nd Edition)"
  sidebar:
    style: "floating"
    search: true
    collapse-level: 2
  page-navigation: true
  chapters:
    - index.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - theme.scss
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    number-sections: false
    smooth-scroll: true
    include-after-body: includes/footer.html
  pdf:
    documentclass: scrreprt

editor: visual