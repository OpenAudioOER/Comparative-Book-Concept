project:
  type: book

book:
  title: "Comparative Politics 2e"
  subtitle: "A Global Analysis of Government, Institutions, and Societies"
  author: "Norah Jones"
  date: "October 2026"
  sidebar:
    style: "floating"
    search: true
    collapse-level: 2
  page-navigation: true
  chapters:
    - index.qmd
    - 01.qmd
    - summary.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme.scss]
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    number-sections: true
    number-depth: 2
    smooth-scroll: true
    include-in-header: includes/header.html
    include-after-body: includes/footer.html
  pdf:
    documentclass: scrreprt

editor: visual